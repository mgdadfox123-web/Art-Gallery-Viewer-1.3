<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>National Gallery of Art</title>
    <style>

    .gallery-header {
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .gallery-header a {
        display: block;
    }

    .gallery-header img {
        display: block;
        width: 100%;
        height: auto;
    }

    .gallery-page {
        width: 100%;
        margin: 0;
        padding: 35px 25px;
        background-color: white;
        color: #222;
        font-size: 16px;
        line-height: 1.6;
    }

    .gallery-intro {
        text-align: left;
        margin-bottom: 30px;
    }

    .gallery-intro h1 {
        margin: 0 0 15px;
        font-size: 32px;
    }

    .gallery-intro p {
        margin: 0;
        max-width: 1000px;
    }

    .gallery-address {
        text-align: left;
        margin-bottom: 35px;
    }

    .gallery-address h2,
    .gallery-highlights h2 {
        font-size: 26px;
        margin: 0 0 15px;
    }

    .gallery-address address {
        font-style: normal;
        margin-bottom: 15px;
    }

    .gallery-address p {
        margin: 8px 0;
    }

    .gallery-address a {
        color: #222;
    }

    .highlight-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .highlight-grid img {
        display: block;
        width: 100%;
        height: auto;
    }

    @media (max-width: 800px) {
        .highlight-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 500px) {
        .gallery-page {
            padding: 25px 15px;
        }

        .highlight-grid {
            grid-template-columns: 1fr;
        }

        .gallery-intro h1 {
            font-size: 28px;
        }
    }
    </style>
    
</head>

<body>

    <header class="gallery-header">
        <a href="proj1.html">
            <img src="images/gallery-thin.png" alt="Art Gallery Viewer">
        </a>
    </header>

    <main class="gallery-page">

        <section class="gallery-intro">
            <h1>National Gallery of Art</h1>

            <p>
                Open to the public and free of charge, the museum was privately
                established in 1937 for the American people by a joint resolution
                of the United States Congress.
            </p>
        </section>

        <section class="gallery-address">
            <h2>Address</h2>

            <address>
                6th &amp; Constitution Ave NW<br>
                Washington, DC, USA
            </address>

            <p>
                <a href="http://www.nga.gov/content/ngaweb.html" target="_blank">
                    Visit Website
                </a>
            </p>

            <p>
                <a href="https://maps.google.com/?q=38.89147,-77.02001" target="_blank">
                    View on Google Maps
                </a>
            </p>
        </section>

        <section class="gallery-highlights">
            <h2>Highlights</h2>

            <div class="highlight-grid">
                <img src="images/nga1.jpg" alt="National Gallery of Art highlight 1">
                <img src="images/nga2.jpg" alt="National Gallery of Art highlight 2">
                <img src="images/nga3.jpg" alt="National Gallery of Art highlight 3">
                <img src="images/nga4.jpg" alt="National Gallery of Art highlight 4">
            </div>
        </section>

    </main>

</body>
</html>
